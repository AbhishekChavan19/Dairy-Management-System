{% extends "base.html" %}
{% block title %}Rate Settings{% endblock %}
{% block heading %}Rate Settings{% endblock %}
{% block subtitle %}Configure the milk pricing formula{% endblock %}
{% block body %}
<div class="card">
  <h3>Pricing parameters</h3>
  <form method="post" class="form-grid">
    <div><label>Dairy name</label><input type="text" name="dairy_name" value="{{ s.dairy_name }}" required></div>
    <div></div>
    <div><label>Rate per Fat % (₹)</label><input type="number" step="0.01" min="0" name="fat_rate" value="{{ '%.2f'|format(s.fat_rate) }}" required></div>
    <div><label>Rate per SNF % (₹)</label><input type="number" step="0.01" min="0" name="snf_rate" value="{{ '%.2f'|format(s.snf_rate) }}" required></div>
    <div><label>Buffalo milk bonus (₹/L)</label><input type="number" step="0.01" min="0" name="buffalo_bonus" value="{{ '%.2f'|format(s.buffalo_bonus) }}" required></div>
    <div></div><div></div>
    <div class="btn-end"><button class="btn" type="submit">Save Settings</button></div>
  </form>
</div>
{% endblock %}
